services:
  oppgaver:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - 'SYNC_TOKEN=${SYNC_TOKEN}'
      - 'ACCESS_CODE=${ACCESS_CODE}'
      - 'ADMIN_CODE=${ADMIN_CODE}'
      - 'ALLOWED_IPS=${ALLOWED_IPS:-}'
    volumes:
      - 'oppgaver-data:/data'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  oppgaver-data:
